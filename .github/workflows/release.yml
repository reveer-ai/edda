# Publishes package.json's version to npm when it isn't there yet, then gives it a GitHub release.
# npm's trusted publisher for edda-ai names this file (release.yml) and the npm environment:
# renaming either breaks publishing until the publisher is recreated on npmjs.com.
# Every step checks its own state, so rerunning a failed run repairs it.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Holds the npm identity token, and nothing that can write to the repository.
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      outcome: ${{ steps.plan.outputs.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check that npm supports trusted publishing (11.5.1 or later)
        run: |
          npm_version=$(npm --version)
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a * 1e6 + b * 1e3 + c < 11005001) {
              console.error(`npm ${process.argv[1]} is older than 11.5.1, which trusted publishing needs.`);
              process.exit(1);
            }
          ' "$npm_version"
      - id: package
        run: |
          echo "name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Decide whether to publish
        run: |
          outcome=$(node scripts/release-plan.js)
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.outcome == 'publish'
        run: npm publish

  # Holds the repository write token, and no npm identity token.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.publish.outputs.name }}
      VERSION: ${{ needs.publish.outputs.version }}
      OUTCOME: ${{ needs.publish.outputs.outcome }}
      # How long to wait for a version this run published to be downloadable: 80 checks, 15 seconds apart.
      NPM_WAIT_CHECKS: 80
      NPM_WAIT_SECONDS: 15
    steps:
      - name: Create the GitHub release if it's missing
        run: |
          tag="v$VERSION"
          on_npm() {
            npm view "$NAME" versions --json --prefer-online | jq -e --arg v "$VERSION" 'index($v) != null' > /dev/null
          }
          downloadable() {
            url=$(npm view "$NAME@$VERSION" dist.tarball --prefer-online 2> /dev/null) || return 1
            [ -n "$url" ] && curl -fsSL -o /dev/null "$url"
          }
          if [ "$OUTCOME" = publish ]; then
            # npm lists a version a minute or two after accepting it, and serves its tarball a few minutes after that.
            # Waiting for the tarball means the GitHub release only appears once the version can be installed.
            checks=1
            until downloadable; do
              if [ "$checks" -ge "$NPM_WAIT_CHECKS" ]; then
                echo "npm still doesn't serve $NAME@$VERSION for download, so there's no GitHub release yet. Rerun this job once it does." >&2
                exit 1
              fi
              checks=$((checks + 1))
              sleep "$NPM_WAIT_SECONDS"
            done
          elif ! on_npm; then
            echo "$NAME@$VERSION isn't on npm, so there's no release to create."
            exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The GitHub release $tag already exists."
            exit 0
          fi
          # Tag the commit npm says it published, which is this run's commit unless a release was missed.
          sha=$(npm view "$NAME@$VERSION" gitHead --prefer-online)
          if [ -z "$sha" ]; then
            echo "npm has no gitHead for $NAME@$VERSION, so the commit to tag is unknown." >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$sha" --title "$tag" --generate-notes
